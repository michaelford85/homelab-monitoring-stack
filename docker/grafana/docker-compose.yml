services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    # Host networking: binds directly to host :3000 and reaches Prometheus at
    # localhost:9090 (also host-networked) without a dedicated docker network.
    network_mode: host
    environment:
      TZ: "America/Chicago"
      # Admin password is managed in-app (stored in 1Password), not here.
      # On a *fresh* volume Grafana defaults to admin/admin and forces a change
      # at first login. To bootstrap non-interactively instead, create a
      # gitignored .env with GF_SECURITY_ADMIN_PASSWORD and reference it here.
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro

volumes:
  grafana_data:
