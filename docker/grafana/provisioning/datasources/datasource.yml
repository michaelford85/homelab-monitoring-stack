# Auto-provisioned Prometheus data source.
# Grafana loads this on startup, so no manual setup is needed after
# `docker compose up`. Because both containers use host networking,
# Prometheus is reachable at localhost:9090.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
